<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="mxLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D9FF" />
      <stop offset="50%" stop-color="#B7A0FF" />
      <stop offset="100%" stop-color="#623BFF" />
    </linearGradient>
    <filter id="mxGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Hexagonal Tech Shield -->
  <polygon points="50,5 90,27.5 90,72.5 50,95 10,72.5 10,27.5" stroke="url(#mxLogoGrad)" stroke-width="3" fill="rgba(16, 22, 41, 0.7)" filter="url(#mxGlow)" />
  <!-- Futuristic M and X monogram geometry -->
  <path d="M28,68 L28,32 L50,54 L72,32 L72,68" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M35,32 L65,68" stroke="url(#mxLogoGrad)" stroke-width="4" stroke-linecap="round" />
  <path d="M65,32 L35,68" stroke="url(#mxLogoGrad)" stroke-width="4" stroke-linecap="round" />
  <circle cx="50" cy="50" r="4" fill="#00D9FF" filter="url(#mxGlow)" />
</svg>

