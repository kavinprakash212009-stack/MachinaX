<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="pChronosBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1828" />
      <stop offset="100%" stop-color="#080b16" />
    </linearGradient>
    <filter id="pGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="600" height="360" fill="url(#pChronosBg)" />
  <!-- Exoskeleton Skeleton Rigging Wireframe -->
  <!-- Torso & Spine -->
  <line x1="300" y1="80" x2="300" y2="200" stroke="#00D9FF" stroke-width="4" filter="url(#pGlow)" />
  <!-- Shoulders -->
  <line x1="220" y1="110" x2="380" y2="110" stroke="#B7A0FF" stroke-width="4" />
  <!-- Arms -->
  <line x1="220" y1="110" x2="190" y2="180" stroke="#FFFFFF" stroke-width="3" />
  <line x1="190" y1="180" x2="180" y2="250" stroke="#00D9FF" stroke-width="3" />
  <line x1="380" y1="110" x2="410" y2="180" stroke="#FFFFFF" stroke-width="3" />
  <line x1="410" y1="180" x2="420" y2="250" stroke="#00D9FF" stroke-width="3" />
  <!-- Pelvis & Legs -->
  <line x1="260" y1="200" x2="340" y2="200" stroke="#B7A0FF" stroke-width="4" />
  <line x1="260" y1="200" x2="240" y2="270" stroke="#00D9FF" stroke-width="4" />
  <line x1="240" y1="270" x2="230" y2="330" stroke="#623BFF" stroke-width="4" />
  <line x1="340" y1="200" x2="360" y2="270" stroke="#00D9FF" stroke-width="4" />
  <line x1="360" y1="270" x2="370" y2="330" stroke="#623BFF" stroke-width="4" />
  <!-- Joints -->
  <circle cx="300" cy="80" r="14" fill="#101629" stroke="#00D9FF" stroke-width="3" />
  <circle cx="220" cy="110" r="8" fill="#00D9FF" />
  <circle cx="380" cy="110" r="8" fill="#00D9FF" />
  <circle cx="240" cy="270" r="7" fill="#B7A0FF" />
  <circle cx="360" cy="270" r="7" fill="#B7A0FF" />
  <circle cx="300" cy="140" r="10" fill="#00FFA3" filter="url(#pGlow)" />
  <text x="560" y="50" text-anchor="end" fill="#00D9FF" font-family="'Orbitron',sans-serif" font-size="11" letter-spacing="1">PROJECT: CHRONOS-IV</text>
  <text x="560" y="70" text-anchor="end" fill="rgba(255,255,255,0.5)" font-family="'JetBrains Mono',monospace" font-size="9">ACTUATION: BIOMORPHIC HYDRAULIC</text>
</svg>

