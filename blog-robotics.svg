<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradRobo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e162f" />
      <stop offset="100%" stop-color="#080b16" />
    </linearGradient>
    <linearGradient id="fiberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D9FF" />
      <stop offset="50%" stop-color="#623BFF" />
      <stop offset="100%" stop-color="#B7A0FF" />
    </linearGradient>
    <filter id="glowRobo">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="600" height="360" fill="url(#bgGradRobo)" />
  <g opacity="0.15">
    <line x1="0" y1="90" x2="600" y2="90" stroke="#00D9FF" stroke-width="1" />
    <line x1="0" y1="180" x2="600" y2="180" stroke="#00D9FF" stroke-width="1" />
    <line x1="0" y1="270" x2="600" y2="270" stroke="#00D9FF" stroke-width="1" />
    <line x1="150" y1="0" x2="150" y2="360" stroke="#00D9FF" stroke-width="1" />
    <line x1="300" y1="0" x2="300" y2="360" stroke="#00D9FF" stroke-width="1" />
    <line x1="450" y1="0" x2="450" y2="360" stroke="#00D9FF" stroke-width="1" />
  </g>
  <!-- Biomorphic Muscle Actuator Graphic -->
  <path d="M 80,180 C 180,90 240,270 340,180 C 440,90 480,270 520,180" fill="none" stroke="url(#fiberGrad)" stroke-width="6" stroke-linecap="round" filter="url(#glowRobo)" />
  <path d="M 80,180 C 180,130 240,230 340,180 C 440,130 480,230 520,180" fill="none" stroke="#00D9FF" stroke-width="2" stroke-dasharray="8 6" opacity="0.8" />
  <!-- Hydraulic nodes -->
  <circle cx="80" cy="180" r="14" fill="#101629" stroke="#00D9FF" stroke-width="3" filter="url(#glowRobo)" />
  <circle cx="340" cy="180" r="18" fill="#101629" stroke="#B7A0FF" stroke-width="3" filter="url(#glowRobo)" />
  <circle cx="520" cy="180" r="14" fill="#101629" stroke="#623BFF" stroke-width="3" filter="url(#glowRobo)" />
  <circle cx="340" cy="180" r="6" fill="#00D9FF" />
  <!-- HUD specs overlay -->
  <rect x="30" y="30" width="160" height="34" rx="6" fill="rgba(8,11,22,0.8)" stroke="rgba(0,217,255,0.4)" stroke-width="1" />
  <text x="42" y="52" fill="#00D9FF" font-family="'Orbitron',sans-serif" font-size="11" letter-spacing="1">ACTUATOR: MK-IV</text>
  <text x="560" y="320" text-anchor="end" fill="rgba(255,255,255,0.5)" font-family="'JetBrains Mono',monospace" font-size="11">FORCE: 8.4 kN // 120Hz</text>
</svg>

