  <rect x="120" y="160" width="360" height="40" rx="20" fill="none" stroke="#623BFF" stroke-width="2" stroke-dasharray="12 6" />
  <circle cx="200" cy="180" r="12" fill="#00FFA3" />
  <circle cx="300" cy="180" r="12" fill="#00D9FF" />
