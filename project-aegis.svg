      <stop offset="0%" stop-color="#0a1f2e" />
      <stop offset="100%" stop-color="#080b16" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#pAegisBg)" />
  <!-- Cryogenic Superconducting Bus Pipe -->
