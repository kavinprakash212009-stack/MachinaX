      <stop offset="0%" stop-color="#091b29" />
      <stop offset="100%" stop-color="#080b16" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#tutBg)" />
  <!-- HUD Graph & Telemetry Stream -->
